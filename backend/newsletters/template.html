<!--
  Newsletter template. Copy this file, rename it for the issue you are writing
  (2026-09-launch.html, say), and edit the prose.

  Email clients strip <style> blocks and ignore most modern CSS, so everything
  is inline and the layout is a single column. Keep it that way.

  {unsubscribe_url} is replaced per recipient. If you delete it, a plain footer
  is appended automatically — but keeping it lets you style your own.

  Run Script - (Update Subject)
  python3 backend/scripts_send_newsletter.py backend/newsletters/template.html \
  --subject "lazymate.dev has a new look"
-->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;max-width:560px;margin:0 auto;padding:8px 0;color:#1f2937;">

  <p style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#6b7280;margin:0 0 20px;">
    From Hillol Barman
  </p>

  <h1 style="font-size:24px;line-height:1.25;font-weight:600;margin:0 0 18px;color:#111827;">
    My First Newsletter
  </h1>

  <p style="font-size:15px;line-height:1.65;margin:0 0 16px;">
    Opening paragraph. Most people read the first
    two lines in a preview pane and decide there.
  </p>

  <p style="font-size:15px;line-height:1.65;margin:0 0 28px;">
    <a href="https://www.lazymate.dev" style="color:#047857;font-weight:600;text-decoration:none;">
      Call to action &rarr;
    </a>
  </p>

  <p style="font-size:15px;line-height:1.65;margin:0 0 8px;">
    Thanks for reading,<br>Hillol
  </p>

  <hr style="margin:32px 0 14px;border:none;border-top:1px solid #e5e7eb;">

  <p style="font-size:12px;line-height:1.6;color:#6b7280;margin:0;">
    You are receiving this because you subscribed at lazymate.dev.
    <a href="{unsubscribe_url}" style="color:#6b7280;">Unsubscribe</a>.
  </p>

</div>
